# TuPigCarPlay release for Tupig/TuPigPlay.
#
# workflow_dispatch: bump SemVer + VERSION_CODE in version.properties, commit on main, push tag.
# push tags v*.*.*: verify tag == v${VERSION_NAME}, assembleRelease, upload APK + SHA256SUMS.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump (always increments VERSION_CODE)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-tupigcarplay
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require main
        run: |
          test "${{ github.ref }}" = "refs/heads/main" || {
            echo "Start this workflow from the main branch." >&2
            exit 1
          }

      - name: Bump version.properties and push tag
        run: |
          python3 scripts/bump_version.py "${{ inputs.bump }}"
          eval "$(python3 scripts/bump_version.py --print | sed 's/^/export /')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): ${VERSION_NAME} (versionCode ${VERSION_CODE})"
          git tag "v${VERSION_NAME}"
          git push origin HEAD:main
          git push origin "v${VERSION_NAME}"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - name: Resolve version
        id: ver
        run: |
          eval "$(python3 scripts/bump_version.py --print | sed 's/^/export /')"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk=TuPigCarPlay-${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches VERSION_NAME
        run: bash scripts/verify_release_tag.sh "${{ github.ref_name }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        run: ./gradlew :mobile:assembleRelease --stacktrace

      - name: Package APK and SHA256SUMS
        run: |
          mkdir -p dist
          SRC="$(ls mobile/build/outputs/apk/release/*.apk | head -1)"
          cp "$SRC" "dist/${{ steps.ver.outputs.apk }}"
          (cd dist && sha256sum "${{ steps.ver.outputs.apk }}" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES="TuPigCarPlay ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})

          Install on the Leapmotor head unit. Update checks use this repository's Releases.
          See docs/wiki/版本与更新.md."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${{ steps.ver.outputs.apk }}" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "dist/${{ steps.ver.outputs.apk }}" dist/SHA256SUMS.txt \
              --title "TuPigCarPlay ${{ steps.ver.outputs.name }}" \
              --notes "$NOTES"
          fi
